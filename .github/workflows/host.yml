name: host

on:
  push:
    branches: [main]
    paths: ['host/**', '.github/workflows/host.yml']
  pull_request:
    paths: ['host/**', '.github/workflows/host.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb
            artifact: host-linux
          - os: windows-latest
            bundles: nsis
            artifact: host-windows
    defaults:
      run:
        working-directory: host
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      # Tauri v2 Linux prerequisites; libudev-dev is for the serialport crate,
      # which enumerates USB serial ports through libudev.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libudev-dev libssl-dev libxdo-dev \
            build-essential curl wget file patchelf

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: host/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: host/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app bundle
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            host/src-tauri/target/release/bundle/${{ matrix.bundles }}/*
